# ============================================================
# TRECHOS SEM EVENTO (estado não muda)
# ============================================================
# Linha 1: "Glória a Deus. Graça e paz, bom dia...": IGNORE (saudação)
# Linha 2: "Pai, no nome de Jesus...": IGNORE (oração inicial)
# Linha 8: "Quando passamos a entender que a voz...": IGNORE (reflexão)
# Linha 9: "A tática do diabo sempre foi a mesma. Lá no Éden...": IGNORE
#   ("Éden" é local, não livro; Adão e Eva são personagens, não referência)
# Linha 12: "Neemias sabia muito bem o propósito...": IGNORE
#   ("Neemias sabia..." é referência a personagem, não pedido de abertura)
# Linha 13: "Fique de pé nesta manhã...": IGNORE (convite)
# Linha 14: "Pai, nós damos ouvidos ao Senhor...": IGNORE (oração final)
