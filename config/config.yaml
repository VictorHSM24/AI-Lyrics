holyrics:
  base_url: "http://127.0.0.1:8091/api"
  token: "JCpH5Wn4Q4zi7og0"
  timeout_ms: 2000

stt:
  backend: "auto"  # Sprint 19.1: auto = CUDA > DirectML > ROCm > CPU
  model: "large-v3-turbo"
  device: "auto"  # Sprint 19.1: auto = seleciona com base no hardware
  compute_type: "auto"  # Sprint 19.1: auto = resolve com base no backend
  language: "pt"
  beam_size: 1
  vad_filter: false
  cpu_threads: 0  # 0 = default do sistema (os.cpu_count())
  chunk_length_s: 30
  gpu_memory_limit_mb: 0  # Sprint 19.1: 0 = sem limite
  vad:
    mode: "silero"
    min_speech_ms: 250
    pause_threshold_ms: 600

llm:
  base_url: "http://127.0.0.1:11434"
  model: "qwen3:8b-q4_k_m"
  lazy_load: true
  timeout_ms: 15000
  max_tokens: 200

search:
  fts5_db: "data/bible.pt-br.sqlite"
  embeddings_path: "data/bible.embeddings.npy"
  embedding_model: "intfloat/multilingual-e5-small"
  embedding_device: "cpu"
  rrf_k: 60
  top_k: 20
  search_gap: 0.15

state:
  default_version: "ACF"
  persist_path: "data/state.json"

# Sprint 21.1 — Semantic Understanding Engine.
# Provider usado pelo SemanticEngine para inferência de referências implícitas.
# Valores de provider:
#   - "stub"   : StubProvider (respostas pré-programadas, para testes)
#   - "ollama" : LocalLLMProvider via Ollama (LLM real)
semantic:
  provider: "ollama"
  enabled: true
  debounce_ms: 800
  timeout_ms: 15000
  min_text_length: 8
  ollama:
    enabled: true
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    model: "qwen3:8b-q4_K_M"
    temperature: 0.1
    top_p: 0.9
    max_tokens: 300
    timeout_seconds: 15
    disable_thinking: true
  # Sprint 22.2 — Priorização RAG e política de contexto do sermão.
  # Princípio: BibleRetriever > Texto Atual > Contexto do Sermão.
  # Quando há candidato dominante (top1 com score alto e gap grande vs
  # top2), o contexto do sermão é omitido do prompt. O contexto só é
  # incluído para desambiguação entre candidatos próximos.
  rag:
    # score mínimo do top1 para classificar como "alta confiança".
    dominant_score: 0.98
    # diferença mínima top1-top2 para classificar como "alta confiança".
    # gap >= dominant_gap → contexto omitido (candidato dominante).
    dominant_gap: 0.08
    # diferença abaixo da qual dois candidatos são considerados empatados
    # (alta ambiguidade) → contexto completo incluído.
    ambiguity_gap: 0.03
  context:
    # confiança mínima do SermonMemory para incluir current_book no
    # prompt em qualquer nível. Abaixo disso, contexto sempre omitido.
    min_confidence: 0.40
    # limiar abaixo do qual o SermonMemory deve zerar current_book/
    # current_chapter (assunto provavelmente mudou). Sprint 22.3
    # implementará a heurística dinâmica; por ora, apenas reservado.
    remove_when_confidence_below: 0.25

cache:
  recent_capacity: 50
  embedding_capacity: 200
  holyrics_ttl_s: 5
  current_verse_ttl_s: 60

confidence:
  min_execute: 0.30
  min_confirm: 0.20
  stt_min: 0.10
  parser_high: 0.90
  parser_compact: 0.85

mode: "auto"

audio:
  input_device: "CODEC USB"
  sample_rate: 16000
  channels: 1
  chunk_ms: 30
  vad_enabled: true
  min_speech_ms: 600
  max_silence_ms: 800
  vad_mode: 3
  max_segment_ms: 30000

log:
  path: "logs/pipeline.jsonl"
  level: "INFO"

# Sprint 21.9 — Telemetria de observabilidade do pipeline.
# Registra eventos detalhados de cada componente em arquivos .jsonl
# para auditoria posterior. Não altera o comportamento do pipeline.
telemetry:
  enabled: true
  # output_dir vazio = usa default (~/AI_Lyrics_telemetry)
  output_dir: ""

# Sprint 22.0 — Bible Knowledge Base (RAG Local).
# Quando habilitado, o BibleRetriever recupera candidatos da Bíblia
# local (data/sources/*.sqlite) e os envia ao SemanticEngine, que atua
# apenas como desambiguador. Quando desabilitado, usa o Modo Atual
# (LLM direto). Permite testes A/B entre as duas arquiteturas.
knowledge:
  enabled: true
  sources_dir: "data/sources"
  top_k: 20
  fallback_on_empty: true
  warmup: true

# Sprint 23.2 — Reading Follow Mode (acompanhamento de leitura).
# Quando o pregador diz um intervalo de versículos (ex.: "Mateus 7 do 1 ao 3"),
# o sistema acompanha a leitura e avança automaticamente.
reading_follow:
  fuzzy_threshold: 0.70
  auto_version_change: true
