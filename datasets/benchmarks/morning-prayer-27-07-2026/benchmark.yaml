# Benchmark oficial: AI Lyrics
# Sermão: Morning Prayer: 27/07/2026
# Arquivo de origem: datasets/sermons/morning prayer/27-07-2026.txt
#
# Este benchmark descreve o comportamento esperado do AI Lyrics
# ao acompanhar a pregação em streaming (segmentos incrementais).
# Cada evento representa uma mudança de estado do sistema.
# Estados: WAIT | PREPARE | PRESENT | IGNORE
#
# decision_source identifica qual subsistema é responsável:
#   parser          : detecção determinística de livro/capítulo/versículo
#   parser + context: parser usando memória de curto prazo (active_book, etc.)
#   semantic_engine : decisão que exige compreensão semântica (passing mention, etc.)
#   ignore          : trecho sem referência, reset automático

# ============================================================
# EVENTO 1: WAIT → PREPARE
# ============================================================
- id: 1
  speech: "Abra comigo a sua Bíblia no livro de Primeiro Coríntios"
  detected:
    books: ["1 Coríntios"]
    chapters: []
    verses: []
    explicit_reference: false
    partial_reference: "Primeiro Coríntios (livro apenas)"
  context:
    active_book: "1 Coríntios"
    active_chapter: null
    pending_reference: "1 Coríntios ?:?"
    last_presented_reference: null
  state: PREPARE
  confidence: 0.40
  candidate_reference: "1 Coríntios"
  expected_action: none
  reason: >
    Livro detectado com comando explícito "Abra comigo a sua Bíblia no livro de".
    Parser identifica "Primeiro Coríntios" como nome canônico de 1 Corinthians.
    Sem capítulo ou versículo ainda. Sistema guarda contexto e aguarda.
  decision_source: parser

