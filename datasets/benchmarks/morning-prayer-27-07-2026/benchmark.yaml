# ============================================================
# EVENTO 3: PRESENT → WAIT
# ============================================================
- id: 3
  speech: >
    "Quando o pastor Marcos pregava ontem sobre Gênesis, uma coisa me veio à
    lembrança: lá em Gênesis, no começo de tudo, a guerra não começou por força
    e nem por violência, mas ela começou quando pessoas deram ouvido a uma voz.
    [...] Como diz lá em Salmos: assenta-se, detém e para."
  detected:
    books: ["Gênesis", "Salmos"]
    chapters: []
    verses: []
    explicit_reference: false
    partial_reference: >
      "Gênesis (menção passiva, 'pregava ontem sobre'),
      Salmos (referência vaga, 'Como diz lá em')"
  context:
    active_book: null
    active_chapter: null
    pending_reference: null
    last_presented_reference: "1 Coríntios 14:10"
  state: WAIT
  confidence: 0.0
  candidate_reference: null
  expected_action: none
  reason: >
    Após apresentar 1 Cor 14:10, sistema reseta para WAIT.
    "Gênesis" aparece em contexto de menção passiva ("pregava ontem sobre Gênesis"),
    não como pedido de abertura. Parser pode detectar o nome do livro, mas
    semantic_engine deve reconhecer o contexto passado e NÃO entrar PREPARE.
    "lá em Gênesis, no começo de tudo" repete Gênesis sem capítulo/versículo;
    "no começo de tudo" não é número de capítulo.
    "Como diz lá em Salmos" é referência vaga sem capítulo/versículo (WAIT por definição).
    Nenhuma referência qualifica para PREPARE. Estado permanece WAIT.
    Este evento é um teste crítico de falso positivo: se a IA for agressiva,
    pode entrar PREPARE para Gênesis ou Salmos incorretamente.
  decision_source: semantic_engine

